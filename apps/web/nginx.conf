# 웹 정적 서빙 + API/MCP 리버스 프록시. compose 네트워크의 api·mcp 서비스로 전달한다.
# 원격 MCP는 인증 없는 공개 읽기 전용이므로 IP당 요청률을 여기서 제한한다.
limit_req_zone $binary_remote_addr zone=mcp_zone:10m rate=2r/s;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # X-Real-IP는 항상 덮어써서 클라이언트 위조를 차단한다(API의 DATANAV_TRUST_PROXY=1과 짝)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE(컨시어지 진행 스트리밍) 실시간 중계
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # §7 정본 URI 디레퍼런싱 — service.datahub.kr/projects/public-data-lens/... 를 API가 해소한다
    location /projects/public-data-lens/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 원격 MCP(streamable HTTP) — 커넥터 등록 URL: https://<도메인>/projects/public-data-lens/mcp
    # 공개 게이트웨이와 동일한 경로 체계(프리픽스 노출, 내부 /mcp 재작성)
    location /projects/public-data-lens/mcp {
        limit_req zone=mcp_zone burst=20 nodelay;
        proxy_pass http://mcp:8300/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }


    # 배포 갱신이 즉시 반영되도록: 진입 문서는 no-cache, 해시 명명 자산은 장기 캐시
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
