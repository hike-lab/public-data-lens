# 진입점은 web(8080) 하나 — API는 nginx 프록시 뒤에만 둔다.
# 카탈로그 갱신(월 1회)은 호스트에서 실행: docker compose run --rm api python scripts/build_catalog.py <CSV>
services:
  api:
    build: apps/server
    environment:
      DATANAV_CORS_ORIGINS: ${DATANAV_CORS_ORIGINS:-*}
      DATANAV_TRUST_PROXY: "1"
      DATANAV_RATE_LIMIT_PER_MIN: ${DATANAV_RATE_LIMIT_PER_MIN:-120}
    volumes:
      - ./data:/app/data
      - ./docs:/app/docs:ro  # 고지문 등 공개 문서 서빙용
    # 디버깅용 로컬 직접 접근(외부 비노출). 클라우드에서는 이 매핑을 제거한다.
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  # 원격 MCP(streamable HTTP) — KOSIS 사례처럼 호스트 앱 커스텀 커넥터에 URL로 등록하는 경로.
  # 외부 노출은 web(nginx)의 /mcp 프록시를 통해서만 한다.
  mcp:
    build: apps/server
    command: ["python", "-m", "datanav.api.mcp_server", "--http"]
    environment:
      DATANAV_MCP_HOST: 0.0.0.0
      DATANAV_MCP_PORT: "8300"
    volumes:
      - ./data:/app/data:ro  # 읽기 전용 — MCP는 카탈로그를 조회만 한다
    restart: unless-stopped

  web:
    build: apps/web
    depends_on:
      - api
      - mcp
    ports:
      - "8088:80"
    restart: unless-stopped
